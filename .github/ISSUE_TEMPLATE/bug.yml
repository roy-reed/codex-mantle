name: Bug report
description: Report a reproducible defect without including private Codex or workspace data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Remove tokens, personal paths, private instructions, and generated schemas before submitting.
  - type: input
    id: version
    attributes:
      label: Mantle version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node, PowerShell (when applicable), and Codex versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a disposable directory and synthetic content where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, personal paths, private instructions, and private schemas.
          required: true
        - label: I searched for an existing issue.
          required: true
